# Git autobuild supplies the Python package. This is an independent preview;
# publish its URL only after runtime, persistence, authorization and rollback QA.
kind: wasmer.io/App.v0
owner: h7osanna_xyc
name: paradome-control-room-pg-preview
package: .
debug: false
capabilities:
  database:
    engine: postgres
  cdn_cache:
    enabled: true
locality:
  regions: [fr-roub1]
volumes:
  - name: private-media
    mount: /data
redirect:
  force_https: true
# The initial compatibility build uses the provider's after-deploy command.
# Add the validated package job command from deployment/wasmer/app.yaml.template
# after confirming the provider's command and source-directory mapping.
