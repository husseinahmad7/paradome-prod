{% load humanize %}
<article class="chat-message" id="message-{{ message.pk }}">
  <div>
    {% if message.user.profile.picture %}
    <figure class="image is-44x44">
      <img class="is-rounded" src="{% url 'users:profile_picture' message.user.username %}" alt="">
    </figure>
    {% else %}
    <span class="avatar-fallback" aria-hidden="true">{{ message.user.username|slice:":1" }}</span>
    {% endif %}
  </div>
  <div>
    <div class="chat-message-meta">
      <strong>@{{ message.user.username }}</strong>
      <time datetime="{{ message.date|date:'c' }}">{{ message.date|naturaltime }}</time>
    </div>
    <p class="chat-message-body">{{ message.body }}</p>
  </div>
  {% if can_delete %}
  <div class="media-right">
    <button
      type="button"
      hx-post="{% url 'chat:msg-delete' message.pk %}"
      hx-target="closest .chat-message"
      hx-swap="outerHTML"
      hx-confirm="Delete this message?"
      class="delete"
      aria-label="Delete message from {{ message.user.username }}"
    ></button>
  </div>
  {% else %}
  <span aria-hidden="true"></span>
  {% endif %}
</article>
