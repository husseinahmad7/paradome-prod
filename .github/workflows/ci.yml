name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: paradome_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    env:
      DJANGO_SETTINGS_MODULE: paradome.settings.production
      DJANGO_SECRET_KEY: ${{ format('{0}{1}', 'ci-only-', 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx') }}
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver
      PUBLIC_SITE_URL: https://testserver
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: paradome_ci
      # The disposable service root account may create Django's test database.
      DB_USER: root
      DB_PASSWORD: ci-root
      EMAIL_HOST: smtp.example.invalid
      EMAIL_PORT: 587
      EMAIL_HOST_USER: ci
      EMAIL_HOST_PASSWORD: ci
      DEFAULT_FROM_EMAIL: noreply@example.invalid
      CONTACT_RECIPIENT: contact@example.invalid
      PUSHER_APP_ID: ci
      PUSHER_KEY: ci
      PUSHER_SECRET: ci
      PUSHER_CLUSTER: eu
      DEMO_ACCOUNT_ENABLED: "true"
      DEMO_USERNAME: paradome-demo
      PRIVATE_MEDIA_ROOT: /tmp/paradome-private-media
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt
      - name: Validate models and production settings
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py check --deploy
      - name: Apply MySQL migrations
        run: |
          python manage.py migrate --noinput
          python manage.py createcachetable
      - name: Build compressed static manifest
        run: python manage.py collectstatic --clear --noinput
      - name: Run full test suite on MySQL
        run: python manage.py test --settings=paradome.settings.ci
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements-production.txt --progress-spinner=off --timeout=60 --vulnerability-service=osv

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan full Git history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
