name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: paradome_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    env:
      DJANGO_SETTINGS_MODULE: paradome.settings.production
      DJANGO_SECRET_KEY: ${{ format('{0}{1}', 'ci-only-', 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx') }}
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver
      PUBLIC_SITE_URL: https://testserver
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: paradome_ci
      # The disposable service root account may create Django's test database.
      DB_USER: root
      DB_PASSWORD: ci-root
      EMAIL_HOST: smtp.example.invalid
      EMAIL_PORT: 587
      EMAIL_HOST_USER: ci
      EMAIL_HOST_PASSWORD: ci
      DEFAULT_FROM_EMAIL: noreply@example.invalid
      CONTACT_RECIPIENT: contact@example.invalid
      PUSHER_APP_ID: ci
      PUSHER_KEY: ci
      PUSHER_SECRET: ci
      PUSHER_CLUSTER: eu
      DEMO_ACCOUNT_ENABLED: "true"
      DEMO_USERNAME: paradome-demo
      PRIVATE_MEDIA_ROOT: /tmp/paradome-private-media
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Verify pinned browser assets and UI recovery contracts
        run: |
          npm ci --ignore-scripts
          npm run search:assets
          npm test
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt
      - name: Verify frozen retrieval policies without refitting
        run: |
          python ml/search/evaluate.py --verify
          python ml/search/evaluate_v2.py --verify
      - name: Validate models and production settings
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py check --deploy
      - name: Apply MySQL migrations
        run: |
          python manage.py migrate --noinput
          python manage.py createcachetable
      - name: Build compressed static manifest
        run: python manage.py collectstatic --clear --noinput --ignore='engineering/search-assets/*'
      - name: Run full test suite on MySQL
        run: python manage.py test --settings=paradome.settings.ci
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements-production.txt --progress-spinner=off --timeout=60 --vulnerability-service=osv

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: paradome_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d paradome_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SETTINGS_MODULE: paradome.settings.ci_postgres
      DJANGO_SECRET_KEY: ${{ format('{0}{1}', 'ci-only-', 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx') }}
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver
      PUBLIC_SITE_URL: https://testserver
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: paradome_ci
      DB_USER: ci
      DB_PASSWORD: ci-postgres
      EMAIL_HOST: smtp.example.invalid
      EMAIL_PORT: 587
      EMAIL_HOST_USER: ci
      EMAIL_HOST_PASSWORD: ci
      DEFAULT_FROM_EMAIL: noreply@example.invalid
      CONTACT_RECIPIENT: contact@example.invalid
      PUSHER_APP_ID: ci
      PUSHER_KEY: ci
      PUSHER_SECRET: ci
      PUSHER_CLUSTER: eu
      DEMO_ACCOUNT_ENABLED: "true"
      DEMO_USERNAME: paradome-demo
      PRIVATE_MEDIA_ROOT: /tmp/paradome-pg-private-media
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install PostgreSQL application dependencies
        run: python -m pip install -r requirements-postgres.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Assemble pinned runtime assets for endpoint regressions
        run: |
          npm ci --ignore-scripts
          npm run search:assets
      - name: Apply PostgreSQL migrations
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py migrate --noinput
      - name: Run full suite including real PostgreSQL races
        run: python manage.py test

  sanitizer:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install native reference sanitizer
        run: python -m pip install -r requirements.txt
      - name: Install pinned WASI compiler
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-wasip1
      - name: Build current Ammonia with locked dependencies
        run: >-
          cargo build --release --locked --target wasm32-wasip1
          --manifest-path deployment/wasmer/sanitizer/Cargo.toml --jobs 2
          --config 'build.rustflags=["--remap-path-prefix=/home/runner/work/paradome-prod/paradome-prod=/source","--remap-path-prefix=/home/runner/.cargo=/cargo"]'
      - name: Verify binary provenance and native/WASI agreement
        run: |
          python deployment/wasmer/sanitizer/freeze.py
          python deployment/wasmer/sanitizer/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-ammonia-wasi
          path: |
            deployment/wasmer/sanitizer/bin/paradome-sanitizer.wasm
            deployment/wasmer/sanitizer/manifest.json
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan full Git history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
