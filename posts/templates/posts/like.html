<button
  class="reaction-button"
  type="button"
  hx-post="{% url 'posts:like' pk %}"
  hx-target="#like{{ pk }}"
  hx-swap="innerHTML"
  aria-pressed="{% if liked %}true{% else %}false{% endif %}"
  aria-label="{% if liked %}Remove reaction from{% else %}React to{% endif %} this post"
>
  {{ likes }} reaction{{ likes|pluralize }}
</button>
