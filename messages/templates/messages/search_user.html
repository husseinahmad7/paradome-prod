{% extends "HusseinAh/base.html" %}
{% load static %}
{% load humanize %}
{% block title %}
Search for user
{% endblock title %}

{% block base %}
<div class="container">
  <form method="get">
      <div class="field has-addons">
      <div class="control">
        <input class="input" name="q" type="text" value="{{ request.GET.q }}" placeholder="Find a user">
      </div>
      <div class="control">
        <button class="button is-info">
          Search
        </button>
      </div>
    </div>
  </form>
  {% for user in users %}
  <div class="box">
      <article class="media">
        <div class="media-left">
          <figure class="image is-64x64">
              {% if user.profile.picture %}
              <img src="{% url 'users:profile_picture' user.username %}" alt="{{user.username}}">
              {% endif %}
          </figure>
        </div>
        <div class="media-content">
          <div class="content">
            <p>
              <strong>{{user.username}}</strong>
              <br>
              {{user.profile.bio}}
            </p>
            <a href="{% url 'posts:user-posts' user.username %}">view profile</a> ||
            <a href="{% url 'messages:directs' user.username %}">start a conversation</a>
          </div>
        </div>
      </article>
    </div>
  {% endfor %}
</div>
  {% endblock %}
